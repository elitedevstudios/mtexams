<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Parent dashboard — progress reports for Learning Adventure">
  <meta name="theme-color" content="#4A90D9">
  <meta name="robots" content="noindex">

  <title>Parent Dashboard 👪 | Learning Adventure</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/navigation.css">

  <style>
    .app-header {
      background: linear-gradient(135deg, var(--color-primary-dark, #2c5aa0) 0%, var(--color-primary) 100%);
      color: white;
      padding-block: var(--space-md);
      box-shadow: var(--shadow-md);
    }
    .app-main { flex: 1; padding-block: var(--space-xl); }
    .app-footer {
      text-align: center;
      padding-block: var(--space-lg);
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      border-block-start: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <header class="app-header">
      <div class="container">
        <a href="index.html" class="app-logo">
          <span class="app-logo__icon">👪</span>
          <span>Parent Dashboard</span>
        </a>

        <nav class="app-nav">
          <a href="index.html" class="app-nav__btn">
            <span>🏠</span>
            <span class="app-nav__label">Home</span>
          </a>
          <a href="lessons.html" class="app-nav__btn">
            <span>🎬</span>
            <span class="app-nav__label">Lessons</span>
          </a>
          <a href="workbook-review.html" class="app-nav__btn">
            <span>📖</span>
            <span class="app-nav__label">Workbooks</span>
          </a>
          <a href="assessments.html" class="app-nav__btn">
            <span>📝</span>
            <span class="app-nav__label">Tests</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="main" class="app-main">
      <div class="container" id="dashboard-content">
        <div class="loading">
          <p class="loading__text">Loading…</p>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="container">
        <p>Made with ❤️ | Grade 2 Jamaica NSC Curriculum</p>
      </div>
    </footer>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/parent-dashboard.js"></script>
